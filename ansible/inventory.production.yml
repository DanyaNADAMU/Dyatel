---
all:
  children:
    core:
      # Production core node: glacier runs dyatel_core against its local
      # PG 15 cluster (dyatel_core_db_manage provisions role+DB one-shot,
      # RFC §9). Masquerade mode is per-host state in the DB (params.mode),
      # set via dyatelctl after deploy: glacier hosts use "nginx" mode —
      # xray@dyatel stays loopback-only, VLESS rides the real vhost TLS
      # (public_port 443, ws_path in the forgejo event-namespace pattern).
      hosts:
        glacier:
          ansible_host: 195.58.153.219
          ansible_port: 5621
          ansible_user: admin
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.first_found', ['/host/stacks/agent/.ssh/glacier-admin', '~/.ssh/glacier-admin']) }}"
          ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=accept-new"
          ansible_become: true
          base_domain: nada.mu
          dyatel_core_node: "glacier"
          # PG 15 runs locally on glacier: role provisions role+DB one-shot.
          dyatel_core_db_host: "/var/run/postgresql"
          dyatel_core_db_manage: true
          # Reuse the existing system xray binary (26.10.31, Infra XTLS
          # legacy path): the role skips download when the binary exists.
          dyatel_core_xray_version: "26.10.31"