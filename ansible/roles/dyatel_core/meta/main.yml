galaxy_info:
  author: Danya
  description: Dyatel core control plane (API + reconcile loop) on a gateway host
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: ArchLinux
      versions: [all]
    - name: Debian
      versions: [bookworm, trixie]

# No role dependencies. Public TLS termination for api.<domain> is the
