name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact .

  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dyatel
          POSTGRES_PASSWORD: dyatel_test_password
          POSTGRES_DB: dyatel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dyatel -d dyatel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (unit + Postgres integration)
        env:
          DYATEL_TEST_DSN: postgres://dyatel:dyatel_test_password@127.0.0.1:5432/dyatel_test?sslmode=disable
        # Run packages sequentially (-p 1) because internal/api and
        # internal/client integration suites share DYATEL_TEST_DSN.
        run: go test -race -p 1 -count=1 ./...

  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and production build
        run: npm run build

  ansible-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install Ansible collections and ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
        run: |
          set -euo pipefail
          uv tool install --with ansible-core ansible-lint
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-galaxy collection install -r ansible/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Run ansible-lint (production profile)
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-collections
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ansible-lint ansible/playbooks/ ansible/roles/
