name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dyatel
          POSTGRES_PASSWORD: dyatel_test_password
          POSTGRES_DB: dyatel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dyatel -d dyatel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install ansible-lint and Ansible collections
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Bootstrap Ansible lint environment
        run: |
          set -euo pipefail
          uv tool install --with ansible-core ansible-lint
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.ansible/collections"
          ansible-galaxy collection install -r ansible/requirements.yml -p "$HOME/.ansible/collections"
